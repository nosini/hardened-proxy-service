# Apps may only send through mihomo's TUN device; only mihomo's own sockets (meta skuid
# mihomo) may use the physical interfaces. "Mihomo" must match tun.device in config.yaml.

# Replace whatever killswitch table is loaded, such as the one blocking everything that
# killswitch.service loads first, in the same transaction. If any of this file or its
# drop-ins fails to load, the old table stays in place.
add table inet killswitch
delete table inet killswitch

table inet killswitch {
    # Destinations apps may reach directly, without the tunnel: the LAN, the router, hosts
    # excluded from the TUN with tun.route-exclude-address. Not a WAN leak, as long as only
    # local addresses go here. Fill them in from /etc/nftables-killswitch.d/ (see the end
    # of this file) so this file stays the same on every machine.
    set direct4 {
        type ipv4_addr
        flags interval
    }

    set direct6 {
        type ipv6_addr
        flags interval
    }

    chain output {
        type filter hook output priority -100; policy drop;
        ct state invalid drop
        oifname "lo" accept
        ip daddr @direct4 accept
        ip6 daddr @direct6 accept
        # Block QUIC for apps (forces TCP), but let mihomo's own outbounds use UDP/443
        udp dport 443 meta skuid != mihomo drop
        oifname "Mihomo" accept
        # mihomo's own outbounds, on whichever uplink the routing table picks
        meta skuid mihomo accept
        # DHCP and DHCPv6, as client and as server. Both ends use ports below 1024, which
        # only privileged processes can bind, so applications can't use them to get around
        # the tunnel. Broadcast, or a unicast address on the LAN: renewals go to the DHCP
        # server itself, which is in direct4. DHCPv6 uses the all-servers multicast
        # address or a link-local server.
        udp sport 68 udp dport 67 ip daddr 255.255.255.255 accept
        udp sport 68 udp dport 67 ip daddr @direct4 accept
        udp sport 67 udp dport 68 ip daddr 255.255.255.255 accept
        udp sport 67 udp dport 68 ip daddr @direct4 accept
        udp sport 546 udp dport 547 ip6 daddr { ff02::1:2, fe80::/10 } accept
        udp sport 547 udp dport 546 ip6 daddr { ff02::1:2, fe80::/10 } accept
        # Neighbor discovery, router solicitation and multicast listener reports, which
        # IPv6 on the uplink needs, and errors and echo replies, which the kernel sends in
        # response to received packets. Echo requests can carry any payload, so they're
        # not accepted here. mDNS (udp 5353 to ff02::fb or 224.0.0.251) is left out:
        # apps reach the LAN through the tunnel, and mihomo's own traffic is covered by
        # its UID.
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-solicit, nd-router-advert,
                      mld-listener-query, mld-listener-report,
                      mld-listener-done, mld2-listener-report,
                      destination-unreachable, packet-too-big,
                      time-exceeded, parameter-problem,
                      echo-reply } accept
    }

    chain input {
        type filter hook input priority -100; policy drop;
        ct state invalid drop
        iifname "lo" accept
        iifname "Mihomo" accept
        # Replies to whatever the output chain let out
        ct state established,related accept
        # DHCP and DHCPv6, as client and as server, restricted as in output: broadcast or
        # the LAN address in direct4, and ff02::1:2 or a link-local server.
        udp sport 67 udp dport 68 ip daddr 255.255.255.255 accept
        udp sport 67 udp dport 68 ip daddr @direct4 accept
        udp sport 68 udp dport 67 ip daddr 255.255.255.255 accept
        udp sport 68 udp dport 67 ip daddr @direct4 accept
        udp sport 547 udp dport 546 ip6 daddr { ff02::1:2, fe80::/10 } accept
        udp sport 546 udp dport 547 ip6 daddr { ff02::1:2, fe80::/10 } accept
        # ND, router solicitation and MLD, plus errors and echo, as in output.
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-solicit, nd-router-advert,
                      mld-listener-query, mld-listener-report,
                      mld-listener-done, mld2-listener-report,
                      destination-unreachable, packet-too-big,
                      time-exceeded, parameter-problem,
                      echo-request, echo-reply } accept
        icmp type echo-request accept
        icmpv6 type echo-request accept
    }

    # Forwarded traffic: containers and VMs that the host bridges. Without this chain,
    # their packets would leave the physical uplink unfiltered whenever mihomo is down.
    # The host's own traffic is checked in output instead. Only established flows and
    # mihomo's TUN are accepted; new connections must enter through the tunnel.
    chain forward {
        type filter hook forward priority -100; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname "Mihomo" accept
        oifname "Mihomo" accept
        # Same direct destinations as output, for containers reaching the LAN
        ip daddr @direct4 accept
        ip6 daddr @direct6 accept
        # Everything else is dropped. VMs on macvlan or macvtap never traverse this hook.
        # With br_netfilter loaded, traffic bridged between a bridge's ports does, so a
        # bridge meant to reach the network directly must be allowed in a .d file:
        #     add rule inet killswitch forward iifname "br0" oifname "br0" accept
    }
}

# Machine-specific additions, e.g. /etc/nftables-killswitch.d/lan.conf containing
#     add element inet killswitch direct4 { 192.168.1.0/24 }
# A wildcard include that matches no files is not an error.
include "/etc/nftables-killswitch.d/*.conf"
